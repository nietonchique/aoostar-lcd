# cargo-deny configuration
# Run: cargo deny check

[advisories]
yanked = "deny"
# Transitive dependencies without an upstream fix; review on major bumps.
ignore = [
    "RUSTSEC-2026-0190",  # bytes: BytesMut::reserve overflow
    "RUSTSEC-2026-0007",  # crossbeam: unsound downcast
    "RUSTSEC-2026-0204",  # crossbeam: invalid pointer dereference
    "RUSTSEC-2026-0192",  # ttf-parser unmaintained (via ab_glyph)
    "RUSTSEC-2024-0436",  # paste unmaintained (via tiny-skia)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"  # path dependencies within the workspace

[sources]
unknown-registry = "deny"
unknown-git = "deny"
